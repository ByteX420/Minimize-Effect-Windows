# Build Release x64 and publish/update a GitHub Release when the product version changes.
#
# Security model (no personal tokens in the repo):
# - Uses only the job-scoped GITHUB_TOKEN (auto-injected by Actions).
# - Never logs tokens; never stores PATs/secrets in source.
# - Minimal permission: contents: write (create tags + release assets only).
# - Runs only on push to `stable` (path-filtered) or manual dispatch — not on PRs/forks.
# - Fork PRs cannot publish releases with write access to this repo.
#
# How to cut a release:
# 1. Bump MINIMIZE_* version macros in app/MinimizeEffect.rc
# 2. Merge to `stable` and push
# 3. This workflow builds MinimizeEffect.exe, zips, and creates/updates tag vX.Y.Z + Release asset

name: Release

on:
  push:
    branches: [stable]
    paths:
      - "app/MinimizeEffect.rc"
      - "app/MinimizeEffect.vcxproj"
      - "hook/MinimizeHook.vcxproj"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      force_version:
        description: "Optional override (e.g. 1.0.1). Leave empty to read from app/MinimizeEffect.rc"
        required: false
        default: ""

# Least privilege for release publishing
permissions:
  contents: write

concurrency:
  group: release-stable
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build + GitHub Release
    if: github.ref == 'refs/heads/stable'
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need full history only if we ever diff; shallow is fine for build
          fetch-depth: 1

      - name: Set compiler cache directory
        shell: pwsh
        run: |
          # runner.temp is available after the job has started, not while
          # GitHub validates job-level environment expressions.
          "CCACHE_DIR=$env:RUNNER_TEMP\ccache" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Read product version
        id: version
        shell: pwsh
        run: |
          $override = "${{ github.event.inputs.force_version }}"
          if ($override -and $override.Trim().Length -gt 0) {
            $ver = $override.Trim().TrimStart('v', 'V')
          } else {
            $rc = Get-Content -Raw "app/MinimizeEffect.rc"
            $m = [regex]::Match($rc, 'MINIMIZE_PRODUCT_VERSION_STR\s+"([^"\\]+)')
            if (-not $m.Success) {
              throw "Could not parse MINIMIZE_PRODUCT_VERSION_STR from app/MinimizeEffect.rc"
            }
            $ver = $m.Groups[1].Value.Trim()
          }
          if ($ver -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') {
            throw "Version '$ver' is not X.Y.Z (or X.Y.Z.W)"
          }
          $tag = "v$ver"
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Product version: $ver  (tag $tag)"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Resolve PlatformToolset
        id: toolset
        shell: pwsh
        run: |
          # Prefer v145 (VS 2026 / 18), fall back to v143 (VS 2022) on older images.
          $candidates = @("v145", "v143", "v142")
          $chosen = $null
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            $install = & $vswhere -latest -products * `
              -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
              -property installationPath
            if ($install) {
              foreach ($ts in $candidates) {
                $props = Get-ChildItem -Path $install -Recurse -Filter "Microsoft.Cpp.$ts.x64.props" `
                  -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($props) { $chosen = $ts; break }
              }
            }
          }
          if (-not $chosen) { $chosen = "v145" }
          "name=$chosen" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Using PlatformToolset=$chosen"

      - name: Restore MSVC compiler cache
        # Pinned action revision; installs a checksum-verified ccache >= 4.10
        # (required for MSVC /Yc + /Yu precompiled-header support).
        uses: hendrikmuhs/ccache-action@9e72c68cf32eb51fa30568928aca57ff79155270
        with:
          variant: ccache
          install: binary
          key: release-${{ runner.os }}-${{ steps.toolset.outputs.name }}-x64
          max-size: 1G
          verbose: 1

      - name: Configure ccache for MSBuild and PCH
        shell: pwsh
        run: |
          $versionText = (& ccache --version | Select-Object -First 1)
          $versionMatch = [regex]::Match($versionText, '(\d+)\.(\d+)\.(\d+)')
          if (-not $versionMatch.Success) {
            throw "Could not determine ccache version from '$versionText'"
          }
          $version = [version]$versionMatch.Value
          if ($version -lt [version]'4.10.0') {
            throw "ccache $version is too old; MSVC PCH caching requires 4.10+"
          }

          # ccache must masquerade as cl.exe when invoked directly by a
          # .vcxproj. It then locates the real compiler later on PATH.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $install) {
            throw "Could not locate the Visual C++ tools"
          }

          $toolset = "${{ steps.toolset.outputs.name }}"
          $versionPrefix = switch ($toolset) {
            "v145" { "14.5" }
            "v143" { "14.3" }
            "v142" { "14.2" }
            default { throw "Unsupported PlatformToolset '$toolset'" }
          }
          $compiler = Get-ChildItem "$install\VC\Tools\MSVC" -Directory |
            Where-Object Name -Like "$versionPrefix*" |
            Sort-Object { [version]$_.Name } -Descending |
            ForEach-Object { Join-Path $_.FullName "bin\Hostx64\x64\cl.exe" } |
            Where-Object { Test-Path -LiteralPath $_ } |
            Select-Object -First 1
          if (-not $compiler) {
            throw "Could not locate cl.exe for PlatformToolset=$toolset"
          }

          $wrapperDirectory = Join-Path $env:RUNNER_TEMP "ccache-msvc"
          $wrapper = Join-Path $wrapperDirectory "cl.exe"
          New-Item -ItemType Directory -Force -Path $wrapperDirectory | Out-Null
          Copy-Item -LiteralPath (Get-Command ccache.exe).Source -Destination $wrapper -Force

          # PCH use requires these two documented ccache settings. Compiler
          # arguments, source/header contents, compiler binary, and PCH data
          # remain part of the cache key.
          ccache --set-config "base_dir=$env:GITHUB_WORKSPACE"
          ccache --set-config "sloppiness=pch_defines,time_macros"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          (Split-Path -Parent $compiler) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "CCACHE_CL_WRAPPER=$wrapper" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Using $versionText with $compiler"

      - name: Build optimized Release x64
        shell: pwsh
        run: |
          $toolset = "${{ steps.toolset.outputs.name }}"
          Write-Host "MSBuild PlatformToolset=$toolset CharacterSet=MultiByte (project defaults + shipping flags)"
          # Match stable shipping flags from the vcxproj. Explicit /p overrides keep CI honest
          # if a local user.props tries to weaken optimisations.
          msbuild MinimizeEffect.slnx `
            /restore `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:PlatformToolset=$toolset `
            /p:CharacterSet=MultiByte `
            /p:WholeProgramOptimization=true `
            /p:Optimization=MaxSpeed `
            /p:InlineFunctionExpansion=AnySuitable `
            /p:FavorSizeOrSpeed=Speed `
            /p:IntrinsicFunctions=true `
            /p:FunctionLevelLinking=true `
            /p:StringPooling=true `
            /p:OmitFramePointers=true `
            /p:FloatingPointModel=Fast `
            /p:RuntimeLibrary=MultiThreaded `
            /p:LinkTimeCodeGeneration=UseLinkTimeCodeGeneration `
            /p:EnableCOMDATFolding=true `
            /p:OptimizeReferences=true `
            /p:LinkIncremental=false `
            "/p:CLToolExe=$env:CCACHE_CL_WRAPPER" `
            /p:TrackFileAccess=false `
            /p:UseMultiToolTask=true `
            /m `
            /v:minimal `
            /nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $bin = "build\bin\x64\Release"
          if (-not (Test-Path "$bin\MinimizeEffect.exe")) { throw "Missing MinimizeEffect.exe" }
          if (-not (Test-Path "$bin\MinimizeEffectHook.dll")) { throw "Missing MinimizeEffectHook.dll" }
          Get-ChildItem $bin -File | Format-Table Name, Length

      - name: Package ZIP
        id: package
        shell: pwsh
        run: |
          $bin = "build\bin\x64\Release"
          $out = "build\dist"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $zipName = "MinimizeEffect-windows-x64.zip"
          $zip = Join-Path $out $zipName
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$bin\MinimizeEffect.exe", "$bin\MinimizeEffectHook.dll" -DestinationPath $zip -Force
          $item = Get-Item $zip
          $checksum = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          $checksumPath = "$zip.sha256"
          "$checksum  $zipName" | Set-Content -LiteralPath $checksumPath -Encoding ascii -NoNewline
          "path=$($item.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "checksum_path=$checksumPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "name=$zipName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Packaged $($item.FullName) ($([math]::Round($item.Length/1MB, 2)) MB, SHA-256 $checksum)"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Minimize Effect ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          # Create if missing; replace assets if the same tag is re-published (e.g. rebuild)
          files: |
            ${{ steps.package.outputs.path }}
            ${{ steps.package.outputs.checksum_path }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## Minimize Effect ${{ steps.version.outputs.tag }}

            Automated **stable** release build (Windows x64, MultiByte, LTCG /O2).

            ### Changes in 1.4.1
            - **Reliable update checks** — the in-app updater now uses the current Minimize-Effect-Windows release repository, ensuring that update availability, downloads, and verification resolve against the right project
            - **Faster release builds** — GitHub Actions now reuses MSVC compilation results and precompiled headers between runs, substantially reducing repeat build time when source files are unchanged
            - **More robust Windows builds** — required system libraries are declared centrally in the project configuration for clearer, more predictable builds

            ### Install
            1. Download **MinimizeEffect-windows-x64.zip**
            2. Extract (keep both files in the same folder)
            3. Run `MinimizeEffect.exe`
            4. Optional: run as Administrator for elevated windows

            ### Package
            - `MinimizeEffect.exe`
            - `MinimizeEffectHook.dll`

            Product version: **${{ steps.version.outputs.version }}**  
            Commit: `${{ github.sha }}`
        env:
          # Built-in token only — never a personal access token from the repo
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
