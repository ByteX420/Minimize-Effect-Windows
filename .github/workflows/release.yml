# Build Release x64 and publish a stable or pre-release GitHub Release.
#
# Security model (no personal tokens in the repo):
# - Uses only the job-scoped GITHUB_TOKEN (auto-injected by Actions).
# - Never logs tokens; never stores PATs/secrets in source.
# - Minimal permission: contents: write (create tags + release assets only).
# - Stable runs on `stable`; beta reuses this workflow through beta-release.yml.
# - Neither release path runs on pull requests or forks.
# - Fork PRs cannot publish releases with write access to this repo.
#
# Stable release:
# 1. Bump MINIMIZE_* version macros in app/MinimizeEffect.rc
# 2. Merge to `stable` and push
# 3. This workflow builds MinimizeEffect.exe, zips, and creates/updates tag vX.Y.Z + Release asset
#
# Pre-release:
# 1. Set the exact version in .github/BETA_VERSION
# 2. Push dev to beta
# 3. Only that version-file change triggers vX.Y.Z-beta.N / vX.Y.Z-rc.N

name: Release

on:
  push:
    branches: [stable]
    paths:
      - "app/MinimizeEffect.rc"
      - "app/MinimizeEffect.vcxproj"
      - "hook/MinimizeHook.vcxproj"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      force_version:
        description: "Optional override (e.g. 1.0.1). Leave empty to read from app/MinimizeEffect.rc"
        required: false
        default: ""
  workflow_call:
    inputs:
      prerelease:
        description: "Build a numbered pre-release from the beta branch"
        required: false
        type: boolean
        default: false

# Least privilege for release publishing
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build + GitHub Release
    if: >-
      (github.ref == 'refs/heads/stable' && !inputs.prerelease) ||
      (github.ref == 'refs/heads/beta' && inputs.prerelease)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need full history only if we ever diff; shallow is fine for build
          fetch-depth: 1

      - name: Set compiler cache directory
        shell: pwsh
        run: |
          # runner.temp is available after the job has started, not while
          # GitHub validates job-level environment expressions.
          "CCACHE_DIR=$env:RUNNER_TEMP\ccache" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Read product version
        id: version
        shell: pwsh
        run: |
          $isPrerelease = "${{ inputs.prerelease }}" -eq "true"
          $channel = ""
          $iteration = ""

          if ($isPrerelease) {
            $versionPath = ".github/BETA_VERSION"
            if (-not (Test-Path -LiteralPath $versionPath)) {
              throw "Missing $versionPath"
            }
            $ver = (Get-Content -Raw -LiteralPath $versionPath).Trim()
            $match = [regex]::Match($ver, '^(\d+\.\d+\.\d+)-([a-zA-Z0-9.-]+)$')
            if (-not $match.Success) {
              throw "BETA_VERSION '$ver' must be a valid pre-release version like 1.5.0-beta.1, 1.5.0-beta.rc, or 1.5.0-rc.1"
            }
            $baseVersion = $match.Groups[1].Value
            $prereleaseTag = $match.Groups[2].Value
            if ($prereleaseTag -match 'rc') {
              $channel = "rc"
            } else {
              $channel = ($prereleaseTag -split '[.-]')[0]
            }
            $iterationMatch = [regex]::Match($prereleaseTag, '(?:^|\.|\D)(\d+)$')
            if ($iterationMatch.Success) {
              $iteration = [int]$iterationMatch.Groups[1].Value
            } else {
              $iteration = 0
            }
            if ($iteration -lt 0 -or $iteration -gt 65535) {
              throw "Pre-release iteration number must be between 0 and 65535"
            }

            # Re-running the same commit may reuse its release. Reusing a
            # manually entered version for different code is rejected.
            $tagRef = "refs/tags/v$ver"
            $remoteTags = @(git ls-remote --tags origin $tagRef)
            if ($LASTEXITCODE -ne 0) {
              throw "Could not query $tagRef"
            }
            if ($remoteTags.Count -gt 0) {
              $escapedRef = [regex]::Escape($tagRef)
              $sameCommit = @(
                $remoteTags | Where-Object { $_ -match "^${{ github.sha }}\s+$escapedRef$" }
              )
              if ($sameCommit.Count -eq 0) {
                throw "v$ver already belongs to another commit. Increase BETA_VERSION."
              }
            }
          } else {
            $override = "${{ github.event.inputs.force_version }}"
            if ($override -and $override.Trim().Length -gt 0) {
              $ver = $override.Trim().TrimStart('v', 'V')
            } else {
              $rc = Get-Content -Raw "app/MinimizeEffect.rc"
              $match = [regex]::Match($rc, 'MINIMIZE_PRODUCT_VERSION_STR\s+"([^"\\]+)')
              if (-not $match.Success) {
                throw "Could not parse MINIMIZE_PRODUCT_VERSION_STR from app/MinimizeEffect.rc"
              }
              $ver = $match.Groups[1].Value.Trim()
            }
            if ($ver -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') {
              throw "Version '$ver' is not X.Y.Z (or X.Y.Z.W)"
            }
            $baseVersion = $ver
          }

          $tag = "v$ver"
          "base_version=$baseVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "prerelease=$($isPrerelease.ToString().ToLowerInvariant())" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "channel=$channel" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "iteration=$iteration" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Product version: $ver (tag $tag, prerelease=$isPrerelease)"

      - name: Stamp pre-release version into Windows resources
        if: inputs.prerelease
        shell: pwsh
        run: |
          $path = "app/MinimizeEffect.rc"
          $displayVersion = "${{ steps.version.outputs.version }}"
          $baseParts = "${{ steps.version.outputs.base_version }}".Split('.')
          $iteration = [int]"${{ steps.version.outputs.iteration }}"
          $numericVersion = "$($baseParts[0]),$($baseParts[1]),$($baseParts[2]),$iteration"
          $content = Get-Content -Raw -LiteralPath $path

          $replacements = [ordered]@{
            '(?m)^#define\s+MINIMIZE_FILE_VERSION\s+[\d, \t]+\r?$' =
              "#define MINIMIZE_FILE_VERSION      $numericVersion"
            '(?m)^#define\s+MINIMIZE_PRODUCT_VERSION\s+[\d, \t]+\r?$' =
              "#define MINIMIZE_PRODUCT_VERSION   $numericVersion"
            '(?m)^#define\s+MINIMIZE_FILE_VERSION_STR\s+"[^"]*"\r?$' =
              "#define MINIMIZE_FILE_VERSION_STR  `"$displayVersion\0`""
            '(?m)^#define\s+MINIMIZE_PRODUCT_VERSION_STR\s+"[^"]*"\r?$' =
              "#define MINIMIZE_PRODUCT_VERSION_STR `"$displayVersion\0`""
            '(?m)^FILEFLAGS\s+0x0L\r?$' =
              "FILEFLAGS      VS_FF_PRERELEASE"
          }
          foreach ($entry in $replacements.GetEnumerator()) {
            $updated = [regex]::Replace($content, $entry.Key, $entry.Value)
            if ($updated -eq $content) {
              throw "Could not stamp resource pattern: $($entry.Key)"
            }
            $content = $updated
          }

          $resolvedPath = (Resolve-Path -LiteralPath $path).Path
          [IO.File]::WriteAllText($resolvedPath, $content, [Text.UTF8Encoding]::new($false))
          Write-Host "Stamped Windows ProductVersion '$displayVersion' ($numericVersion, prerelease flag)"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore MSVC compiler cache
        # Pinned action revision; installs a checksum-verified ccache >= 4.10
        # (required for MSVC /Yc + /Yu precompiled-header support).
        uses: hendrikmuhs/ccache-action@9e72c68cf32eb51fa30568928aca57ff79155270
        with:
          variant: ccache
          install: binary
          key: release-${{ runner.os }}-v145-x64
          max-size: 1G
          verbose: 1

      - name: Configure ccache for MSBuild and PCH
        shell: pwsh
        run: |
          $versionText = (& ccache --version | Select-Object -First 1)
          $versionMatch = [regex]::Match($versionText, '(\d+)\.(\d+)\.(\d+)')
          if (-not $versionMatch.Success) {
            throw "Could not determine ccache version from '$versionText'"
          }
          $version = [version]$versionMatch.Value
          if ($version -lt [version]'4.10.0') {
            throw "ccache $version is too old; MSVC PCH caching requires 4.10+"
          }

          # ccache must masquerade as cl.exe when invoked directly by a
          # .vcxproj. It then locates the real compiler later on PATH.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $install) {
            throw "Could not locate the Visual C++ tools"
          }

          $compiler = Get-ChildItem "$install\VC\Tools\MSVC" -Directory |
            Where-Object Name -Like "14.5*" |
            Sort-Object { [version]$_.Name } -Descending |
            ForEach-Object { Join-Path $_.FullName "bin\Hostx64\x64\cl.exe" } |
            Where-Object { Test-Path -LiteralPath $_ } |
            Select-Object -First 1
          if (-not $compiler) {
            throw "Could not locate cl.exe for PlatformToolset=v145"
          }

          $wrapperDirectory = Join-Path $env:RUNNER_TEMP "ccache-msvc"
          $wrapper = Join-Path $wrapperDirectory "cl.exe"
          New-Item -ItemType Directory -Force -Path $wrapperDirectory | Out-Null
          Copy-Item -LiteralPath (Get-Command ccache.exe).Source -Destination $wrapper -Force

          # PCH use requires these two documented ccache settings. Compiler
          # arguments, source/header contents, compiler binary, and PCH data
          # remain part of the cache key.
          ccache --set-config "base_dir=$env:GITHUB_WORKSPACE"
          ccache --set-config "sloppiness=pch_defines,time_macros"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          (Split-Path -Parent $compiler) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "CCACHE_CL_WRAPPER=$wrapper" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Using $versionText with $compiler"

      - name: Build optimized Release x64
        shell: pwsh
        run: |
          Write-Host "MSBuild PlatformToolset=v145 CharacterSet=MultiByte (project defaults + shipping flags)"
          # Match stable shipping flags from the vcxproj. Explicit /p overrides keep CI honest
          # if a local user.props tries to weaken optimisations.
          msbuild MinimizeEffect.slnx `
            /restore `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:PlatformToolset=v145 `
            /p:CharacterSet=MultiByte `
            /p:WholeProgramOptimization=true `
            /p:Optimization=MaxSpeed `
            /p:InlineFunctionExpansion=AnySuitable `
            /p:FavorSizeOrSpeed=Speed `
            /p:IntrinsicFunctions=true `
            /p:FunctionLevelLinking=true `
            /p:StringPooling=true `
            /p:OmitFramePointers=true `
            /p:FloatingPointModel=Fast `
            /p:RuntimeLibrary=MultiThreaded `
            /p:LinkTimeCodeGeneration=UseLinkTimeCodeGeneration `
            /p:EnableCOMDATFolding=true `
            /p:OptimizeReferences=true `
            /p:LinkIncremental=false `
            "/p:CLToolExe=$env:CCACHE_CL_WRAPPER" `
            /p:TrackFileAccess=false `
            /p:UseMultiToolTask=true `
            /m `
            /v:minimal `
            /nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $bin = "build\bin\x64\Release"
          if (-not (Test-Path "$bin\MinimizeEffect.exe")) { throw "Missing MinimizeEffect.exe" }
          if (-not (Test-Path "$bin\MinimizeEffectHook.dll")) { throw "Missing MinimizeEffectHook.dll" }
          Get-ChildItem $bin -File | Format-Table Name, Length

      - name: Package ZIP
        id: package
        shell: pwsh
        run: |
          $bin = "build\bin\x64\Release"
          $out = "build\dist"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          if ("${{ steps.version.outputs.prerelease }}" -eq "true") {
            $zipName = "MinimizeEffect-windows-x64-${{ steps.version.outputs.version }}.zip"
          } else {
            $zipName = "MinimizeEffect-windows-x64.zip"
          }
          $zip = Join-Path $out $zipName
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$bin\MinimizeEffect.exe", "$bin\MinimizeEffectHook.dll" -DestinationPath $zip -Force
          $item = Get-Item $zip
          $checksum = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          $checksumPath = "$zip.sha256"
          "$checksum  $zipName" | Set-Content -LiteralPath $checksumPath -Encoding ascii -NoNewline
          "path=$($item.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "checksum_path=$checksumPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "name=$zipName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Packaged $($item.FullName) ($([math]::Round($item.Length/1MB, 2)) MB, SHA-256 $checksum)"

      - name: Publish stable GitHub Release
        if: ${{ !inputs.prerelease }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Minimize Effect ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          # Create if missing; replace assets if the same tag is re-published (e.g. rebuild)
          files: |
            ${{ steps.package.outputs.path }}
            ${{ steps.package.outputs.checksum_path }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## Minimize Effect ${{ steps.version.outputs.tag }}

            Automated **stable** release build (Windows x64, MultiByte, LTCG /O2).

            ### Changes in 1.5.0-beta.rc
            - Improved frame pacing, animation rendering, and context menu input handling.
            - Maintained window animations active while dragging the settings window.
            - Isolated stress test feedback and status from the repair tab.
            - Scoped bulk minimize and restore actions to honor display exclusion settings.

            ### Install
            1. Download **MinimizeEffect-windows-x64.zip**
            2. Extract (keep both files in the same folder)
            3. Run `MinimizeEffect.exe`
            4. Optional: run as Administrator for elevated windows

            ### Package
            - `MinimizeEffect.exe`
            - `MinimizeEffectHook.dll`

            Product version: **${{ steps.version.outputs.version }}**  
            Commit: `${{ github.sha }}`
        env:
          # Built-in token only — never a personal access token from the repo
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish pre-release on GitHub
        if: inputs.prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Minimize Effect ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          files: |
            ${{ steps.package.outputs.path }}
            ${{ steps.package.outputs.checksum_path }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## Minimize Effect ${{ steps.version.outputs.tag }}

            Public **${{ steps.version.outputs.channel }} pre-release** built from the `beta` branch.
            This build may be unstable and does not replace the latest stable download.

            ### Changes in 1.5.0-beta.rc
            - Improved frame pacing, animation rendering, and context menu input handling.
            - Maintained window animations active while dragging the settings window.
            - Isolated stress test feedback and status from the repair tab.
            - Scoped bulk minimize and restore actions to honor display exclusion settings.

            ### Install
            1. Download **${{ steps.package.outputs.name }}**
            2. Extract it (keep both files in the same folder)
            3. Run `MinimizeEffect.exe`
            4. Optional: run as Administrator for elevated windows

            ### Package
            - `MinimizeEffect.exe`
            - `MinimizeEffectHook.dll`

            Product version: **${{ steps.version.outputs.version }}**
            Commit: `${{ github.sha }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
